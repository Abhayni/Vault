<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOD VAULT — Private File &amp; Mod Dashboard</title>
    <meta
      name="description"
      content="Private owner-only Minecraft mod and 5 TB Google Drive file management dashboard powered by Supabase Auth and PostgreSQL."
    />
    <meta property="og:title" content="MOD VAULT — Private File & Mod Dashboard" />
    <meta
      property="og:description"
      content="Private owner-only Minecraft mod and 5 TB Google Drive file management dashboard powered by Supabase Auth and PostgreSQL."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('mod_vault_theme_v1') || 'light';
          var dark =
            t === 'dark' ||
            (t === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#F8FAFC] dark:bg-[#090B12] text-slate-900 dark:text-[#F1F5F9] antialiased selection:bg-[#8B5CF6]/25 selection:text-slate-900 dark:selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
